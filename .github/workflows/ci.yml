name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    name: Build & smoke test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [all, fast]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libstdc++-12-dev

      - name: Build (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "all" ]; then
            make
          else
            make ${{ matrix.target }}
          fi

      - name: Smoke test
        run: bash tests/smoke.sh ./speederv2
        timeout-minutes: 2

      - name: IPv6 smoke test
        run: bash tests/smoke_ipv6.sh ./speederv2
        timeout-minutes: 3
